[project]
name = "shared-subspace"
version = "0.1.0"
description = "Shared-subspace analyses and anonymized reviewer examples"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.3.4",
    "scipy==1.16.0",
    "scikit-learn==1.7.0",
    "joblib==1.5.1",
    "threadpoolctl==3.6.0",
    "pandas==2.3.1",
    "h5py==3.14.0",
    "tables==3.10.2",
    "tqdm==4.67.3",
    "spikeinterface==0.104.2",
    "statsmodels==0.14.5",
    "pingouin==0.5.5",
    "diptest==0.10.0",
    "matplotlib==3.10.3",
    "matplotlib-venn==1.1.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.5.6",
    "ipykernel==6.29.5",
]

[tool.uv]
package = false
